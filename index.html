    <script>
      // Suppress Vite HMR WebSocket connection errors in restricted iframe sandbox
      (function() {
        // Safe WebSocket wrapper to swallow Vite HMR connection errors in iframe
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            try {
              var ws = protocols ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
              ws.addEventListener('error', function(e) {
                if (e) {
                  e.preventDefault?.();
                  e.stopImmediatePropagation?.();
                }
              });
              return ws;
            } catch (err) {
              return {
                addEventListener: function() {},
                removeEventListener: function() {},
                send: function() {},
                close: function() {}
              };
            }
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }

        var filterMsg = function(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return str.indexOf('websocket') !== -1 || str.indexOf('[vite] failed') !== -1 || str.indexOf('[vite]') !== -1 || str.indexOf('failed to connect to websocket') !== -1;
        };

        ['log', 'info', 'warn', 'error', 'debug'].forEach(function(method) {
          var orig = console[method];
          if (orig) {
            console[method] = function() {
              for (var i = 0; i < arguments.length; i++) {
                if (filterMsg(arguments[i])) return;
              }
              orig.apply(console, arguments);
            };
          }
        });

        window.addEventListener('unhandledrejection', function(event) {
          if (!event) return;
          var r = event.reason;
          var msg = (r && (r.message || r.stack || (typeof r === 'string' ? r : ''))) || '';
          if (filterMsg(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          if (!event) return;
          var msg = (event.message || '') + '';
          if (filterMsg(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        // Remove any Vite error overlay custom elements if created
        var removeOverlays = function() {
          var overlays = document.querySelectorAll('vite-error-overlay');
          overlays.forEach(function(el) { el.remove(); });
        };
        if (typeof window !== 'undefined') {
          window.addEventListener('DOMContentLoaded', removeOverlays);
          setInterval(removeOverlays, 1500);
        }
      })();
    </script>
